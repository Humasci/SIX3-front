# Rebuilds the site every morning so scheduled blog posts go live on their publish date
# (each post gets its own prerendered page, sitemap and RSS entry).
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one for "main",
# then GitHub → repo → Settings → Secrets and variables → Actions → add VERCEL_DEPLOY_HOOK with its URL.
name: Daily rebuild

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC every day
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
