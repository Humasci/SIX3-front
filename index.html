    <!-- Google Analytics 4: replace the placeholder with the real measurement ID to switch it on.
         It loads after the page has finished loading, so it never slows the first view. -->
    <script>
      (function () {
        var id = "G-XXXXXXXXXX";
        if (/X{4}/.test(id)) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", id);
        window.addEventListener("load", function () {
          setTimeout(function () {
            var s = document.createElement("script");
            s.async = true;
            s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
            document.head.appendChild(s);
          }, 1500);
        });
      })();
    </script>
